<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14523A" />
    <!-- Mode standalone PWA: nama standar (Chrome/Android) dipasang berdampingan
         dengan varian `apple-` karena Safari iOS lama masih membaca yang itu. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Buku Wahidiyah" />
    <meta
      name="description"
      content="Aplikasi Buku Wahidiyah - Perpustakaan Digital & Langganan Buku Wahidiyah"
    />
    <title>E-Book Wahidiyah — Perpustakaan Digital</title>
    <!--
    R29 (revisi akhir) — Tipografi kini 100% font bawaan OS (system stack).
    Riwayat: Google Fonts (2 origin pihak ketiga) -> @fontsource self-host
    (font jadi biaya unduhan terbesar ~235-365 KB pada Slow 4G) -> kini
    dihapus total: unduhan font = 0 KB, tanpa FOUT, tanpa origin tambahan.
    Identitas serif dipertahankan lewat stack serif OS untuk judul (.font-display)
    dan stack Arab bawaan OS (.font-arabic) sehingga teks Arab tetap terrender.
  --></head>

  <body class="bg-cream-50 text-ink-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
